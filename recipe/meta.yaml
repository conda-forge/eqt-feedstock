{% set name = "eqt" %}
{% set version = "2.0.1" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/eqt-{{ version }}.tar.gz
  sha256: c85c8b3a9e6b7ca430fda0dad129090c5b87b3a20c5f9eee3dd1bdff95d311f7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm >=3.4
    - pip
  run:
    - python >={{ python_min }}
    - qdarkstyle
    - qtpy

test:
  imports:
    - eqt
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip
    - pyside2

about:
  home: https://github.com/TomographicImaging/eqt
  summary: A number of templates and tools to develop Qt GUIs with Python effectively
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - casperdcl
    - paskino
